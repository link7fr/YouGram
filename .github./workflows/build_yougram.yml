name: Build YouGram APK

on:
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu' # Меняем дистрибутив для лучшей совместимости с NDK
        cache: 'gradle'

    - name: Create Fake API Keys File
      run: |
        # Екстере обязательно нужен файл API_KEYS в корне, иначе сборщик падает
        echo "APP_ID=123456" > API_KEYS
        echo "APP_HASH=abcdef0123456789abcdef0123456789" >> API_KEYS
        echo "MAPS_V2_API=mock_key" >> API_KEYS

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      # Запускаем сборку через флаг игнорирования ошибок ворнингов и собираем универсальный APK
      run: ./gradlew assembleDebug --no-daemon -x test

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: YouGram-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"

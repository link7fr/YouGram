name: Build YouGram APK

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # Скачиваем код вместе со всеми модулями Telegram

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew :TMessagesProj:assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: YouGram-Debug-APK
        path: TMessagesProj/build/outputs/apk/debug/*.apk
